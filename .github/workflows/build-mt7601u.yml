name: build-mt7601u

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/build_mt7601u.sh'
      - '.github/workflows/build-mt7601u.yml'
      - 'config/**'
      - 'scripts/check_versions.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 90

    steps:
      - name: 取出仓库文件
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq \
            build-essential bc bison flex libssl-dev xz-utils \
            gcc-arm-linux-gnueabihf git curl ca-certificates kmod python3

      - name: 编译 mt7601u 驱动
        run: bash scripts/build_mt7601u.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-ko
          path: |
            out_mt7601u/*.ko
            out_mt7601u/mt7601u.bin
          if-no-files-found: error
          retention-days: 30

      - name: 推送产物到 mt7601u-out 分支
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          mkdir -p /tmp/mt-out
          cp out_mt7601u/*.ko /tmp/mt-out/ 2>/dev/null || true
          cp out_mt7601u/*.bin /tmp/mt-out/ 2>/dev/null || true
          cp build_mt7601u.log /tmp/mt-out/ 2>/dev/null || true
          git checkout --orphan mt7601u-out
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/mt-out/* .
          git add -A
          git commit -m "mt7601u build output" || true
          git push -f origin mt7601u-out
          echo "=== pushed files ==="
          ls -lh
