name: build-wpa-static

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/build_wpa_static.sh'
      - '.github/workflows/build-wpa-static.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    timeout-minutes: 60

    steps:
      - name: 取出仓库文件
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq \
            build-essential gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libssl-dev pkg-config curl ca-certificates file automake autoconf libtool bison flex

      - name: 编译静态 wpa_supplicant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/build_wpa_static.sh

      - name: 把日志塞进 Summary（无需权限即可查看）
        if: always()
        run: |
          {
            echo '## 完整编译日志'
            echo '```'
            cat out_wpa/build.log 2>/dev/null || echo 'build.log 不存在'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传编译日志（成功失败都传，便于诊断）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpa-build-log
          path: out_wpa/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: 发布 Release（公开仓库可匿名下载）
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wpa-static-latest
          name: static wpa_supplicant for E900V22D
          body: 静态链接、无 HIDL 依赖的 wpa_supplicant，替换盒子上崩溃的 Android HIDL 版
          files: |
            out_wpa/wpa_supplicant_static
          fail_on_unmatched_files: false
